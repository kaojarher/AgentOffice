<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b202c">
<meta name="description" content="小蝦辦公室：把多角色 AI 工作流變成像素辦公室。角色會依真實執行狀態走動、思考、讀檔、寫檔、等待核准。單檔、跨平台、響應式。">
<title>小蝦辦公室 · 多角色工作流</title>
<style>
:root{--bg:#12151d;--panel:#1b202c;--panel2:#262d3d;--panel3:#303951;--ink:#e9edf6;--mute:#9aa5c0;--line:#3a4560;--accent:#ffb84d;--accent-ink:#2a1a00;--acc2:#4dd4c0;--ok:#5fd37a;--warn:#ff9c6b;--bad:#ff6b6b;--info:#6aa8ff;--vio:#b48cff;--tool:#151a26;--soft:#243247;--r:6px;--hh:56px;--sh:0px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
/* ---- 通用元件 ---- */
button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:5px 12px;background:var(--panel3);border:2px solid #000;border-radius:var(--r);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.08);touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:hover{background:#3b4666}
button:active{transform:translateY(1px);box-shadow:inset 0 2px 0 rgba(0,0,0,.35)}
button:disabled{opacity:.45;pointer-events:none}
button.pri{background:var(--accent);color:var(--accent-ink);font-weight:700}button.pri:hover{background:#ffc873}
button.ok{background:#2e7d46}button.ok:hover{background:#38965a}
button.bad{background:#8e3434}button.bad:hover{background:#a74141}
button.sm,button.cp{min-height:30px;padding:2px 9px;font-size:13px}
button.on{outline:2px solid var(--acc2);outline-offset:-2px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;min-width:0;padding:7px 9px;min-height:38px;background:#0f131b;border:2px solid #000;border-radius:var(--r);color:var(--ink)}
textarea{resize:vertical;min-height:0}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 2px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>select,.row>input[type=text]{flex:1;width:auto}
.grow{flex:1;min-width:0}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);margin:6px 12px 0 0}
.mut,.sub{color:var(--mute);font-size:12px}
code{background:#0d1017;padding:1px 6px;border-radius:4px;font:12px ui-monospace,Menlo,Consolas,monospace;color:#ffd45c}
.lab{font-size:12px;color:var(--mute);margin:10px 0 2px;font-weight:600}
.card{background:var(--panel2);border:2px solid #000;border-radius:var(--r);padding:8px 10px;margin:8px 0}
details.card>summary{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px}
.step{border-left:4px solid var(--accent)}
.sec{border-top:2px solid #000;padding:4px 0}.sec:first-child{border-top:0}
.sec>details>summary{font-weight:700;cursor:pointer;padding:8px 0}
.folder{font-size:13px;margin-top:6px;word-break:break-all}.bad-t{color:var(--warn)}
.pill{display:inline-block;padding:0 8px;border-radius:99px;font-size:12px;font-weight:700;color:#10131a;background:var(--mute);vertical-align:1px}
.st-idle{background:#8d97b3}.st-thinking{background:#9ad0ff}.st-reading{background:var(--vio)}.st-working{background:var(--info)}.st-permission{background:var(--bad)}.st-waiting{background:#ffd45c}
.av{width:36px;height:39px;image-rendering:pixelated;flex:none;background:rgba(255,255,255,.05);border-radius:4px}
.sav{width:24px;height:26px;image-rendering:pixelated;flex:none}
.seg{display:flex;gap:6px;margin:6px 0}.seg button{flex:1}
/* ---- 頂欄 ---- */
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));background:var(--panel);border-bottom:2px solid #000;z-index:30;flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.brand svg{width:26px;height:26px;image-rendering:pixelated}
#btnPend{background:var(--bad);font-weight:700;animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{filter:brightness(1.35)}}
/* ---- 版面 ---- */
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) clamp(400px,36vw,560px);min-height:0}
#stage{position:relative;display:flex;align-items:center;justify-content:center;padding:12px;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 40%,#202737 0,#12151d 75%)}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;border:3px solid #000;box-shadow:0 0 0 3px #323b52,0 14px 40px rgba(0,0,0,.55);background:#0d1017;max-width:100%;cursor:pointer}
#cv.edit{touch-action:none;cursor:crosshair}
.hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);max-width:92%;background:rgba(0,0,0,.65);padding:4px 10px;border-radius:99px;font-size:12px;color:var(--mute);pointer-events:none;text-align:center}
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:2px solid #000}
.tabs{display:flex;background:#151925;border-bottom:2px solid #000;flex:none;z-index:15}
.tab{flex:1;min-height:44px;border:0;border-radius:0;background:none;box-shadow:none;color:var(--mute);font-weight:700;white-space:nowrap;padding:8px 2px}
.tab:hover{background:#1b202c}.tab:active{transform:none}
.tab[aria-selected=true]{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent);background:var(--panel)}
.panes{flex:1;overflow:auto;padding:12px;padding-bottom:max(16px,env(safe-area-inset-bottom));min-height:0}
.pane[hidden]{display:none}
/* ---- 執行頁 ---- */
.bar textarea{height:72px;margin-bottom:6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts #run,.acts #stop,.acts #hist{grid-column:1/-1}
#pend{margin:10px 0;border:2px solid var(--bad);border-radius:var(--r);padding:8px 10px;background:rgba(255,107,107,.08)}
#pend .ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
#pend .card{margin:8px 0 0}
#pend pre{margin:6px 0;white-space:pre-wrap;word-break:break-all;max-height:150px;overflow:auto;background:var(--tool);padding:6px 8px;border-radius:6px;font:12px ui-monospace,Menlo,Consolas,monospace}
#pend textarea{height:130px;margin:6px 0}
#pend .del{border-color:var(--bad)}
#prog{margin:10px 0;padding:8px 10px;border:2px solid #000;border-radius:var(--r);background:var(--panel2)}
.pbar{height:8px;background:var(--tool);border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--ok));transition:width .3s}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
#stat{font-size:12.5px;color:var(--mute)}
#prog.col #chips{display:none}
#chips{display:flex;align-items:stretch;gap:4px;overflow-x:auto;padding:14px 6px 10px}
.grp{display:flex;flex-direction:column;gap:14px;justify-content:center}
.arr{align-self:center;color:var(--mute);font-size:20px;padding:0 2px}
.note{--bgc:#fff3a3;position:relative;flex:none;width:150px;min-height:104px;padding:16px 10px 12px;background:var(--bgc);color:#2b2b1f;border-radius:2px 2px 16px 2px;box-shadow:0 3px 8px rgba(0,0,0,.4);font-size:12.5px;line-height:1.4;transform:rotate(var(--rot,-1.2deg));cursor:pointer;transition:transform .2s,opacity .2s}
.note:hover{transform:rotate(0) translateY(-2px)}
.note::before{content:"";position:absolute;top:-7px;left:50%;width:46px;height:14px;margin-left:-23px;background:rgba(255,255,255,.6);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.note b{display:block;font-size:13.5px}
.note .tk{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0 6px}
.note small{display:block;color:#5a5a45;font-size:11px}
.note .stamp{position:absolute;right:8px;bottom:8px;font-size:12px;font-weight:700;border:2px solid currentColor;border-radius:6px;padding:0 6px;transform:rotate(-8deg);background:rgba(255,255,255,.35)}
.note.c0{--bgc:#fff3a3}.note.c1{--bgc:#ffc9d9}.note.c2{--bgc:#bfe3ff}.note.c3{--bgc:#c8f0c0}.note.c4{--bgc:#ffd9a8}.note.c5{--bgc:#e0cdfb}
.note.wait{opacity:.85}.note.skip{opacity:.45}
.note.run{outline:3px solid var(--acc2);animation:pulse 1.4s ease-in-out infinite}
.note.run .stamp{color:#0f6b5c}.note.ok .stamp{color:#1b6b3a}
.note.bad{outline:3px dashed #c4501f}.note.bad .stamp,.note.err .stamp{color:#c4501f}
@keyframes pulse{50%{transform:rotate(0) scale(1.04)}}
#detail .drow{display:flex;gap:10px;align-items:center}
.dcard{border-color:var(--accent)}
.log{list-style:none;margin:6px 0 0;padding:0;max-height:180px;overflow:auto;font-size:12.5px}
.log li{padding:3px 0;border-bottom:1px dashed #34405c;display:flex;gap:6px}
.log time{color:var(--mute);font:11px ui-monospace,Menlo,Consolas,monospace;flex:none;padding-top:2px}
/* ---- 輸出紀錄 ---- */
.m{margin:0 0 12px;padding:9px 13px;border-radius:10px;white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:2px solid #000}
.m .who{display:block;font-size:12px;color:var(--accent);margin-bottom:2px}
.m.md{white-space:normal}
.md h3,.md h4,.md h5,.md h6{margin:.6em 0 .2em;font-size:1em}
.md pre{background:var(--tool);padding:8px;border-radius:6px;overflow:auto;white-space:pre-wrap}
.md code{background:var(--tool)}
.md p,.md ul,.md ol{margin:.4em 0}.md ul,.md ol{padding-left:1.4em}
.md table{border-collapse:collapse;display:block;overflow-x:auto;margin:.5em 0}.md th,.md td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap}.md th{background:var(--tool)}
.md blockquote{margin:.5em 0;padding-left:10px;border-left:3px solid var(--accent);color:var(--mute)}.md hr{border:0;border-top:1px solid var(--line);margin:.8em 0}
.md a{color:var(--acc2)}
.m.md .body{max-height:60vh;overflow:auto;padding-right:4px}
.dls{margin-top:8px}
.m.h{background:var(--soft);border-color:var(--accent)}
.m.e{border-color:var(--warn);color:var(--warn)}
.m.s{background:none;border:0;color:var(--mute);padding:2px 4px;font-size:13px}
details.t{margin:0 0 10px;background:var(--tool);border-radius:8px;padding:5px 12px;font-size:12px}
details.t summary{cursor:pointer;color:var(--mute)}
details.t pre{margin:6px 0;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto}
/* ---- 工作區檔案 ---- */
.files{list-style:none;margin:6px 0;padding:0;max-height:220px;overflow:auto}
.files li{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed #34405c;font-size:13px}
.files li span{flex:1;min-width:0;word-break:break-all}
.files li small{color:var(--mute)}
/* ---- 佈局編輯 ---- */
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tool{flex-direction:column;gap:2px;padding:6px 2px;font-size:11.5px;min-height:52px}
.tool span{font-size:18px;line-height:1}
.tool[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pal{flex-direction:column;gap:2px;padding:3px;min-height:0;font-size:11px;color:var(--mute)}
.pal canvas{image-rendering:pixelated;display:block}
.pal[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:-1px;color:var(--ink)}
.stepper{display:flex;align-items:center;gap:8px;margin:6px 0}
.stepper b{min-width:28px;text-align:center;font-family:ui-monospace,monospace}
.about{font-size:12.5px;color:var(--mute);margin-top:10px}
/* ---- 提示 / 對話框 ---- */
#toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#000;color:#fff;border:2px solid var(--accent);padding:8px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center;font-size:13px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
dialog{background:var(--panel);color:var(--ink);border:2px solid #000;border-radius:10px;padding:16px;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h3{margin:0 0 8px}
dialog textarea{height:170px;font:12px ui-monospace,Menlo,Consolas,monospace;color:#cfe3ff}
.wrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* ---- 導覽 ---- */
.help{position:fixed;inset:0;z-index:100}
.help.dim{background:rgba(0,0,0,.6)}
.spot{position:fixed;z-index:1;border-radius:10px;pointer-events:none;box-shadow:0 0 0 3px var(--accent),0 0 0 100vmax rgba(0,0,0,.6);transition:left .25s,top .25s,width .25s,height .25s;animation:spotp 1.6s ease-in-out infinite}
@keyframes spotp{50%{box-shadow:0 0 0 7px var(--accent),0 0 0 100vmax rgba(0,0,0,.6)}}
.hbox{position:absolute;z-index:2;left:0;top:0;background:var(--panel);color:var(--ink);border:2px solid #000;border-radius:12px;width:min(440px,calc(100vw - 24px));display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.harr{position:absolute;width:12px;height:12px;background:var(--panel);border:0 solid #000;transform:rotate(45deg)}
.harr.al{left:-7px;border-left-width:2px;border-bottom-width:2px}
.harr.au{top:-7px;border-top-width:2px;border-left-width:2px}
.harr.ad{bottom:-7px;border-right-width:2px;border-bottom-width:2px}
.harr.ar{right:-7px;border-top-width:2px;border-right-width:2px}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 18px 8px}
.hhead h2{margin:0;font-size:17px}
.hbody{padding:4px 18px 8px;overflow:auto;flex:1;min-height:0}
.hbody p,.hbody ul{margin:.5em 0}.hbody ul{padding-left:1.3em}.hbody li{margin:.3em 0}
.hbody .tip{background:var(--soft);border-left:3px solid var(--accent);border-radius:4px;padding:6px 10px;font-size:13px}
.hbody .where{display:inline-block;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 10px;margin:0 0 4px}
.hfoot{display:flex;align-items:center;gap:8px;padding:10px 18px 14px;border-top:2px solid #000;flex-wrap:wrap}
.hdots{display:flex;gap:2px;flex:1;justify-content:center;align-items:center;flex-wrap:wrap}
.dot{width:16px;height:16px;min-height:0;padding:0;border-radius:50%;border:0;background:none;box-shadow:none;position:relative}
.dot::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid var(--accent)}
.dot.on::before{background:var(--accent)}
.hcount{font-size:12px;color:var(--mute)}
/* ---- 手機 / 窄螢幕 ---- */
@media (max-width:860px){
  body{height:auto;min-height:100dvh;overflow:visible;display:block}
  .top{position:sticky;top:0}
  main{display:block}
  #stage{position:sticky;top:var(--hh);z-index:20;padding:8px;background:#12151d;border-bottom:2px solid #000;box-shadow:0 6px 14px rgba(0,0,0,.4)}
  #cv{border-width:2px;box-shadow:0 0 0 2px #323b52}
  .hint{display:none}
  aside{border-left:0;overflow:visible}
  .panes{overflow:visible}
  .tabs{position:sticky;top:calc(var(--hh) + var(--sh))}
  input,select,textarea{font-size:16px}
  .acts{grid-template-columns:1fr 1fr}
  .tools{grid-template-columns:repeat(5,1fr)}
}
@media (max-width:420px){.brand b{display:none}.note{width:136px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="brand">
    <svg viewBox="0 0 13 13" aria-hidden="true" shape-rendering="crispEdges"><rect width="13" height="13" fill="#262d3d"/><rect x="2" y="2" width="9" height="6" fill="#12151d"/><rect x="3" y="3" width="7" height="4" fill="#ff7a59"/><rect x="5" y="8" width="3" height="1" fill="#9aa5c0"/><rect x="3" y="10" width="7" height="1" fill="#ffb84d"/><rect x="4" y="4" width="1" height="1" fill="#12151d"/><rect x="8" y="4" width="1" height="1" fill="#12151d"/></svg>
    <b>小蝦辦公室</b>
  </div>
  <div class="grow"></div>
  <button id="btnPend" hidden title="有待處理的核准／確認">⚑ 待處理 <b id="pendN"></b></button>
  <button id="btnSound" aria-pressed="true" title="音效">🔊</button>
  <button id="btnHelp" title="使用說明" aria-label="使用說明">？</button>
</header>

<main>
  <div id="stage">
    <canvas id="cv" role="img" aria-label="像素辦公室畫面：每個角色是一位 AI 角色，動作反映它正在做的事"></canvas>
    <div class="hint" id="hint"></div>
  </div>
  <aside>
    <nav class="tabs" role="tablist" aria-label="功能分頁">
      <button class="tab" role="tab" data-tab="run" aria-selected="true">執行</button>
      <button class="tab" role="tab" data-tab="team" aria-selected="false">團隊</button>
      <button class="tab" role="tab" data-tab="set" aria-selected="false">設定</button>
      <button class="tab" role="tab" data-tab="layout" aria-selected="false">佈局</button>
    </nav>
    <div class="panes">
      <section class="pane" id="p-run">
        <div class="bar">
          <textarea id="goal" placeholder="輸入這次流程的總目標，例如：整理 inbox 內的會議記錄，產出本週摘要"></textarea>
          <div class="acts">
            <button class="pri" id="run">▶ 執行流程</button><button class="bad" id="stop" hidden>■ 停止</button>
            <select id="from" title="起始步驟" aria-label="起始步驟"></select>
            <button id="dl">下載紀錄</button>
            <select id="hist" title="歷史紀錄" aria-label="歷史紀錄"></select>
          </div>
        </div>
        <div id="pend" hidden></div>
        <div id="prog" hidden><div class="pbar"><i id="pfill"></i></div><div class="srow"><div id="stat"></div><button class="cp" id="ptog">收合便利貼</button></div><div id="chips"></div></div>
        <div id="detail" hidden></div>
        <div id="log" style="margin-top:12px"></div>
      </section>
      <section class="pane" id="p-team" hidden><div id="teamBox"></div></section>
      <section class="pane" id="p-set" hidden><div id="setBox"></div></section>
      <section class="pane" id="p-layout" hidden>
        <div class="tools" id="tools"></div>
        <div id="palFloor" class="palette"></div>
        <div id="palFurn" class="palette" hidden></div>
        <div class="lab">辦公室尺寸</div>
        <div class="stepper"><span>寬</span><button class="sm" data-size="c-" aria-label="寬度減一">−</button><b id="szC"></b><button class="sm" data-size="c+" aria-label="寬度加一">＋</button>
          <span style="margin-left:10px">高</span><button class="sm" data-size="r-" aria-label="高度減一">−</button><b id="szR"></b><button class="sm" data-size="r+" aria-label="高度加一">＋</button></div>
        <div class="wrap">
          <button class="sm" id="btnUndo">↶ 復原</button><button class="sm" id="btnRedo">↷ 重做</button>
          <button class="sm" id="btnDefault">還原預設佈局</button><button class="sm" id="btnIO">⇅ 匯入/匯出佈局</button>
        </div>
        <p class="about">選工具後在畫面上點擊或拖曳繪製。電腦版：右鍵＝橡皮擦、<code>R</code>＝旋轉、<code>Ctrl+Z</code>／<code>Ctrl+Y</code>＝復原／重做。<b>每個角色需要一張工作桌</b>，桌子不夠時多出的角色會站著工作。</p>
        <p class="about" id="deskInfo"></p>
      </section>
    </div>
  </aside>
</main>

function skyKey(){const d=new Date();return skyPhase()+d.getHours()+':'+d.getMinutes()}
function buildStatic(){
 const L=O.layout,W=L.cols*TS,H=L.rows*TS;
 const cv=O.staticCv||(O.staticCv=document.createElement('canvas'));cv.width=W;cv.height=H;
 const g=cv.getContext('2d');g.imageSmoothingEnabled=false;
 for(let r=0;r<L.rows;r++)for(let c=0;c<L.cols;c++){
  const v=L.tiles[r][c],x=c*TS,y=r*TS;
  if(v===0){g.fillStyle='#10131a';g.fillRect(x,y,TS,TS);g.fillStyle='#161a24';g.fillRect(x,y,8,8);g.fillRect(x+8,y+8,8,8)}
  else if(v===1){
   const below=r+1<L.rows?L.tiles[r+1][c]:0;
   if(below>=2){g.fillStyle='#5d6987';g.fillRect(x,y,TS,TS);g.fillStyle='#7683a5';g.fillRect(x,y,TS,2);g.fillStyle='#4e5973';for(let i=0;i<TS;i+=8)g.fillRect(x+i,y+2,1,TS-5);g.fillStyle='#3f485f';g.fillRect(x,y+13,TS,3);g.fillStyle='#566380';g.fillRect(x,y+13,TS,1)}
   else{g.fillStyle='#303952';g.fillRect(x,y,TS,TS);g.fillStyle='#3a4560';g.fillRect(x+1,y+1,TS-2,TS-2);g.fillStyle='#2a3248';g.fillRect(x,y+TS-1,TS,1)}
  }else floorTile(g,v,x,y,c,r);
 }
 for(let r=1;r<L.rows;r++)for(let c=0;c<L.cols;c++)if(L.tiles[r][c]>=2&&L.tiles[r-1][c]===1){g.fillStyle='rgba(0,0,0,.2)';g.fillRect(c*TS,r*TS,TS,3);g.fillStyle='rgba(0,0,0,.1)';g.fillRect(c*TS,r*TS+3,TS,2)}
 const o={phase:skyPhase(),t:0};
 L.furn.filter(f=>FURN[f.t].under).forEach(f=>drawFurn(g,f,f.c*TS,f.r*TS,o));
 L.furn.filter(f=>FURN[f.t].wall).forEach(f=>drawFurn(g,f,f.c*TS,f.r*TS,o));
 O.staticKey=skyKey();
}
function rebuild(){
 const L=O.layout;
 O.walk=L.tiles.map(row=>row.map(v=>v>=2));
 L.furn.forEach(f=>{const d=FURN[f.t];if(d.block)for(let j=0;j<d.h;j++)for(let i=0;i<d.w;i++)if(inb(f.c+i,f.r+j))O.walk[f.r+j][f.c+i]=false});
 O.seats=[];O.coffeeSpots=[];
 L.furn.forEach(f=>{
  if(f.t==='desk'){const[dx,dy]=SEATOFF[f.rot&3],c=f.c+dx,r=f.r+dy;if(inb(c,r)&&O.walk[r][c])O.seats.push({key:'d'+f.c+','+f.r,kind:'desk',c,r,dir:FACE[f.rot&3],desk:f,owner:null,occ:null})}
  else if(f.t==='sofa'){for(let i=0;i<2;i++){const c=f.c+i;if(inb(c,f.r)&&O.walk[f.r][c])O.seats.push({key:'s'+c+','+f.r,kind:'lounge',c,r:f.r,dir:0,occ:null})}}
  else if(f.t==='coffee'){N4.forEach(([dx,dy])=>{const c=f.c+dx,r=f.r+dy;if(inb(c,r)&&O.walk[r][c]){const vx=-dx,vy=-dy;O.coffeeSpots.push({c,r,face:vy>0?0:vy<0?2:vx<0?1:3})}})}
 });
 buildStatic();
 // 重新分配座位
 const agents=O.agents.filter(a=>!a.sub);
 agents.forEach(a=>{a.loungeSeat=null;if(a.seat&&a.activity==='lounge')a.activity=null});
 const deskSeats=O.seats.filter(s=>s.kind==='desk');
 const prevKeys=agents.map(a=>a.seatKey);
 agents.forEach(a=>{a.seat=null});
 agents.forEach((a,i)=>{const s=deskSeats.find(q=>q.key===prevKeys[i]&&!q.owner);if(s){s.owner=a;a.seat=s}});
 agents.forEach(a=>{if(!a.seat){const s=deskSeats.find(q=>!q.owner);if(s){s.owner=a;a.seat=s}}a.seatKey=a.seat?a.seat.key:null;a.goalDirty=true});
 // 校正位置
 [...O.agents,...O.pets].forEach(e=>{
  const c=Math.floor(e.x),r=Math.floor(e.y);
  if(!inb(c,r)||!O.walk[r][c]){const q=nearestWalk(c,r);if(q){e.x=q[0]+.5;e.y=q[1]+.5}e.path=[];e.mode='stand';e.goal=null}
 });
}
function nearestWalk(c,r){
 let best=null,bd=1e9;
 for(let y=0;y<O.layout.rows;y++)for(let x=0;x<O.layout.cols;x++)if(O.walk[y][x]){const d=(x-c)**2+(y-r)**2;if(d<bd){bd=d;best=[x,y]}}

}

/* ====================== 尋路與移動 ====================== */
function findPath(sc,sr,tc,tr){
 const{cols,rows}=O.layout;if(!inb(tc,tr)||!O.walk[tr][tc])return null;
 if(sc===tc&&sr===tr)return[];
 const prev=new Int32Array(cols*rows).fill(-1),q=[sr*cols+sc];prev[sr*cols+sc]=sr*cols+sc;
 for(let i=0;i<q.length;i++){
  const cur=q[i],cc=cur%cols,cr=(cur/cols)|0;
  for(const[dx,dy]of N4){
   const nc=cc+dx,nr=cr+dy;if(nc<0||nr<0||nc>=cols||nr>=rows)continue;
   const ni=nr*cols+nc;if(prev[ni]>=0||!O.walk[nr][nc])continue;prev[ni]=cur;
   if(nc===tc&&nr===tr){const path=[];let k=ni;while(k!==sr*cols+sc){path.push([k%cols,(k/cols)|0]);k=prev[k]}return path.reverse()}
   q.push(ni);
  }
 }
 return null;
}
function reach(sc,sr,maxD=99){
 const{cols,rows}=O.layout,dist=new Int16Array(cols*rows).fill(-1),q=[sr*cols+sc],out=[];dist[sr*cols+sc]=0;
 for(let i=0;i<q.length;i++){const cur=q[i],cc=cur%cols,cr=(cur/cols)|0;if(dist[cur]>0)out.push([cc,cr]);if(dist[cur]>=maxD)continue;
  for(const[dx,dy]of N4){const nc=cc+dx,nr=cr+dy;if(nc<0||nr<0||nc>=cols||nr>=rows)continue;const ni=nr*cols+nc;if(dist[ni]>=0||!O.walk[nr][nc])continue;dist[ni]=dist[cur]+1;q.push(ni)}}
 return out;
}
function stepEntity(e,dt){
 if(!e.path.length)return;
 const[tc,tr]=e.path[0],tx=tc+.5,ty=tr+.5,dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy),st=e.speed*dt;
 e.mode='walk';
 if(d<=st){e.x=tx;e.y=ty;e.path.shift();if(!e.path.length)arrive(e)}
 else{e.x+=dx/d*st;e.y+=dy/d*st;e.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?3:1):(dy>0?0:2)}
}
function arrive(e){
 const g=e.goal;e.path=[];
 if(g&&g.type==='seat'){e.mode='sit';e.dir=g.seat.dir;e.x=g.seat.c+.5;e.y=g.seat.r+.5}
 else{e.mode=e.sleepy?'sit':'stand';if(g&&g.face!=null)e.dir=g.face;e.activity=g&&g.activity||null}
 e.dwell=(g&&g.dwell)||rnd(2,5);
}
function goTo(e,c,r,o={}){
 const path=findPath(Math.floor(e.x),Math.floor(e.y),c,r);
 if(!path){e.dwell=rnd(1,3);return false}
 e.goal=Object.assign({type:'tile'},o);e.path=path;e.activity=null;
 if(!path.length)arrive(e);else e.mode='walk';return true;
}
function goSeat(e,seat,dwell){
 const path=findPath(Math.floor(e.x),Math.floor(e.y),seat.c,seat.r);
 e.goal={type:'seat',seat,dwell};e.activity=null;
 if(!path){e.x=seat.c+.5;e.y=seat.r+.5;e.path=[];arrive(e);return}
 e.path=path;if(!path.length)arrive(e);else e.mode='walk';
}

function addPet(){

 if(ls.length){const s=pick(ls);c=s.c;r=s.r}else{const w=nearestWalk(Math.floor(O.layout.cols*.7),Math.floor(O.layout.rows*.7));if(!w)return;c=w[0];r=w[1]}
 O.pets=[{kind:'cat',x:c+.5,y:r+.5,dir:1,mode:'stand',path:[],goal:null,speed:1.5,dwell:rnd(1,3),anim:0,sleepy:false}];
}
function updatePet(e,dt){

 if(e.emote){e.emote.t-=dt;if(e.emote.t<=0)e.emote=null}
 if(e.path.length)return;
 e.dwell-=dt;if(e.dwell>0)return;
 const k=Math.random();
 if(e.mode==='sleep'&&k<.5){e.mode='stand';e.dwell=rnd(1,3);return}
 if(k<.55){const tl=reach(Math.floor(e.x),Math.floor(e.y),9);if(tl.length){const[c,r]=pick(tl);goTo(e,c,r,{dwell:rnd(1,4)})}else e.dwell=3}

}

/* ====================== 行為(閒置/就座) ====================== */
const wantDesk=s=>s==='thinking'||s==='reading'||s==='working'||s==='permission'||s==='waiting';
function replan(a){
 releaseLounge(a);
 if(wantDesk(a.status)){
  if(a.seat){const at=a.mode==='sit'&&Math.floor(a.x)===a.seat.c&&Math.floor(a.y)===a.seat.r&&!a.path.length;if(!at)goSeat(a,a.seat)}

}
function pickIdle(a){

 const opts=[];
 if(atDesk)opts.push(['stay',2]);else if(a.seat)opts.push(['desk',2]);
 if(O.coffeeSpots.length)opts.push(['coffee',3]);
 const ls=O.seats.filter(s=>s.kind==='lounge'&&!s.occ);if(ls.length)opts.push(['lounge',3]);
 opts.push(['wander',2]);
 let sum=opts.reduce((x,o)=>x+o[1],0),k=Math.random()*sum,ch='wander';for(const o of opts){k-=o[1];if(k<=0){ch=o[0];break}}
 if(ch==='stay'){a.dwell=rnd(3,7)}
 else if(ch==='desk'){goSeat(a,a.seat,rnd(4,9))}
 else if(ch==='coffee'){const sp=pick(O.coffeeSpots);goTo(a,sp.c,sp.r,{face:sp.face,activity:'coffee',dwell:rnd(5,9)})}
 else if(ch==='lounge'){const s=pick(ls);s.occ=a;a.loungeSeat=s;goSeat(a,s,rnd(8,18))}
 else{const tl=reach(Math.floor(a.x),Math.floor(a.y),8);if(tl.length){const[c,r]=pick(tl);goTo(a,c,r,{dwell:rnd(1.5,4)})}else a.dwell=rnd(2,4)}
}
function updateAgent(a,dt){

 if(a.emote){a.emote.t-=dt;if(a.emote.t<=0)a.emote=null}

}

function fit(){

 const availW=Math.max(120,stage.clientWidth-pd);

 const s=Math.min(availW/W,availH/H),dpr=window.devicePixelRatio||1;
 let d=s*dpr;const di=Math.floor(d);if(di>=1&&di/d>=.85)d=di;
 const cw=Math.round(W*d),ch=Math.round(H*d);
 if(cv.width!==cw||cv.height!==ch){cv.width=cw;cv.height=ch}

function beginChange(){const E=O.edit;if(!E.dirty){E.dirty=true;E.undo.push(E.snap);if(E.undo.length>60)E.undo.shift();E.redo.length=0;updateUndo()}O.layoutDirty=true}
function canPlace(tp,c,r){
 const d=FURN[tp],L=O.layout;
 if(c<0||r<0||c+d.w>L.cols||r+d.h>L.rows)return false;
 for(let i=0;i<d.w;i++){const v=L.tiles[r][c+i];if(d.wall?v!==1:v<2)return false}
 return true;
}
function applyAt(p){
 const E=O.edit,L=O.layout,c=Math.floor(p.x/TS),r=Math.floor(p.y/TS);
 if(!inb(c,r))return;
 const tool=E.erasing?'erase':E.tool;
 if(tool==='floor'){
  if(L.tiles[r][c]!==E.floor){beginChange();L.tiles[r][c]=E.floor;L.furn=L.furn.filter(f=>!(FURN[f.t].wall&&covers(f,c,r)))}
 }else if(tool==='wall'){
  if(L.tiles[r][c]!==1){beginChange();L.tiles[r][c]=1;L.furn=L.furn.filter(f=>FURN[f.t].wall||!covers(f,c,r))}
 }else if(tool==='furn'){
  if(!canPlace(E.furn,c,r))return;
  const d=FURN[E.furn],lay=d.wall?'wall':d.under?'under':'floor';
  const same=L.furn.find(f=>f.t===E.furn&&f.c===c&&f.r===r&&(f.rot|0)===(d.rot?E.rot:0));
  if(same)return;
  beginChange();
  L.furn=L.furn.filter(f=>{if(layerOf(f)!==lay)return true;for(let i=0;i<d.w;i++)if(covers(f,c+i,r))return false;return true});
  L.furn.push({t:E.furn,c,r,rot:d.rot?E.rot:0});
 }else if(tool==='erase'){
  const has=L.furn.some(f=>covers(f,c,r));
  if(has){beginChange();L.furn=L.furn.filter(f=>!covers(f,c,r))}
  else if(L.tiles[r][c]!==0){beginChange();L.tiles[r][c]=0}
 }else if(tool==='rot'){
  const f=[...L.furn].reverse().find(f=>covers(f,c,r)&&FURN[f.t].rot);
  if(f){if(!E.rotDone){beginChange();f.rot=((f.rot|0)+1)&3;E.rotDone=true;setTimeout(()=>{E.rotDone=false},180)}}
  else if(!E.rotWarn){toast('這個家具不能旋轉');E.rotWarn=true;setTimeout(()=>{E.rotWarn=false},900)}
 }
}
function undo(){const E=O.edit;if(!E.undo.length)return;E.redo.push(JSON.stringify(O.layout));O.layout=JSON.parse(E.undo.pop());O.layoutDirty=true;updateUndo()}
function redo(){const E=O.edit;if(!E.redo.length)return;E.undo.push(JSON.stringify(O.layout));O.layout=JSON.parse(E.redo.pop());O.layoutDirty=true;updateUndo()}

 const E=O.edit;E.snap=JSON.stringify(L);E.dirty=false;beginChange();
 const tiles=[];for(let r=0;r<nr;r++){tiles.push([]);for(let c=0;c<nc;c++)tiles[r].push(r<L.rows&&c<L.cols?L.tiles[r][c]:0)}
 L.tiles=tiles;L.cols=nc;L.rows=nr;L.furn=L.furn.filter(f=>f.c+FURN[f.t].w<=nc&&f.r+FURN[f.t].h<=nr);

 },

/* ---------- Markdown / 匯出 ---------- */
function md(t){
  const bl=[];t=t.replace(/```[^\n]*\n([\s\S]*?)```/g,(_,c)=>{bl.push(c);return "\n\u0000"+(bl.length-1)+"\u0000\n"});
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const Ls=t.split("\n"),o=[],LI=/^\s*([-*]|\d+\.)\s+/,TB=/^\s*\|.*\|\s*$/;let i=0;
  while(i<Ls.length){
    const l=Ls[i];let m;
    if(/^\u0000\d+\u0000$/.test(l.trim())){o.push("<pre>"+esc(bl[+l.trim().slice(1,-1)])+"</pre>");i++}
    else if(m=l.match(/^(#{1,6})\s+(.*)/)){const n=Math.min(m[1].length+2,6);o.push("<h"+n+">"+inl(m[2])+"</h"+n+">");i++}
    else if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){o.push("<hr>");i++}
    else if(TB.test(l)){const rows=[];while(i<Ls.length&&TB.test(Ls[i])){rows.push(Ls[i]);i++}
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim());
      o.push("<table>"+rows.filter(r=>!/^\s*\|[\s:|-]+\|\s*$/.test(r)).map((r,k)=>"<tr>"+cells(r).map(c=>(k?"<td>":"<th>")+inl(c)+(k?"</td>":"</th>")).join("")+"</tr>").join("")+"</table>")}
    else if(LI.test(l)){const ord=/^\s*\d+\./.test(l),it=[];while(i<Ls.length&&LI.test(Ls[i])){it.push(Ls[i].replace(LI,""));i++}
      o.push((ord?"<ol>":"<ul>")+it.map(x=>"<li>"+inl(x)+"</li>").join("")+(ord?"</ol>":"</ul>"))}
    else if(/^>\s?/.test(l)){const q=[];while(i<Ls.length&&/^>\s?/.test(Ls[i])){q.push(Ls[i].replace(/^>\s?/,""));i++}o.push("<blockquote>"+q.map(inl).join("<br>")+"</blockquote>")}
    else if(!l.trim())i++;
    else{const p=[];while(i<Ls.length&&Ls[i].trim()&&!/^(#{1,6}\s|>|\u0000)/.test(Ls[i])&&!LI.test(Ls[i])&&!TB.test(Ls[i])&&!/^\s*---+\s*$/.test(Ls[i])){p.push(Ls[i]);i++}
      if(!p.length){p.push(Ls[i]);i++}o.push("<p>"+p.map(inl).join("<br>")+"</p>")}
  }
  return o.join("")}
const strip=x=>String(x).replace(/\*\*(.+?)\*\*/g,"$1").replace(/`([^`]+)`/g,"$1").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1");
const titleOf=(t,n)=>{const m=t.match(/^#{1,6}\s+(.*)/m);return strip(m?m[1]:(n||"output")).trim()||"output"};
const fname=(t,n)=>titleOf(t,n).replace(/[\\\/:*?"<>|\s]+/g,"_").slice(0,40);
function toPdf(txt,name){
  const css='body{font:14px/1.7 "Noto Sans TC","Microsoft JhengHei",sans-serif;color:#111;margin:24px}h3{font-size:1.6em}h4{font-size:1.3em}h3,h4,h5,h6{margin:1em 0 .3em}pre{background:#f3f3f3;padding:8px;white-space:pre-wrap}code{background:#f3f3f3;padding:0 3px}table{border-collapse:collapse;margin:.5em 0}td,th{border:1px solid #bbb;padding:4px 8px}th{background:#eee}blockquote{border-left:3px solid #999;margin:.5em 0;padding-left:10px;color:#555}hr{border:0;border-top:1px solid #ccc}';
  const f=document.createElement("iframe");f.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0";document.body.append(f);
  f.srcdoc='<!doctype html><meta charset="utf-8"><title>'+esc(titleOf(txt,name))+"</title><style>"+css+"</style>"+md(txt);
  f.onload=()=>setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),60000)},250);
  setStat("請在列印視窗的「目的地」選擇「另存為 PDF」");
}
let pptxP=null;
function loadPptx(){
  if(window.PptxGenJS)return Promise.resolve();if(pptxP)return pptxP;
  const urls=["https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js","https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"];
  pptxP=(async()=>{for(const u of urls){try{await new Promise((ok,no)=>{const e=document.createElement("script");e.src=u;e.onload=ok;e.onerror=no;document.head.append(e)});if(window.PptxGenJS)return}catch(e){}}throw new Error("無法載入 PPTX 產生器（pptxgenjs），請確認網路連線")})();
  pptxP.catch(()=>pptxP=null);return pptxP}
function mdSlides(txt){
  txt=txt.replace(/```[^\n]*\n([\s\S]*?)```/g,(_,c)=>c);
  const parts=/^\s*---+\s*$/m.test(txt)?txt.split(/^\s*---+\s*$/m):txt.split(/^(?=#{1,2}\s)/m);
  return parts.map(c=>c.trim()).filter(Boolean).map(c=>{
    let title="";const items=[],tbl=[];
    for(const raw of c.split("\n")){const l=raw.trimEnd();if(!l.trim())continue;let m;
      if(m=l.match(/^#{1,6}\s+(.*)/)){if(!title)title=m[1];else items.push({t:m[1],head:true});continue}
      if(/^\s*\|.*\|\s*$/.test(l)){if(!/^\s*\|[\s:|-]+\|\s*$/.test(l))tbl.push(l.trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim()));continue}
      if(m=l.match(/^(\s*)([-*]|\d+\.)\s+(.*)/)){items.push({t:m[3],bul:true,lv:Math.min(2,Math.floor(m[1].length/2))});continue}
      items.push({t:l.replace(/^>\s?/,"").trim()})}
    return{title,items,tbl}})}
async function toPptx(txt,name){
  await loadPptx();
  const slides=mdSlides(txt);if(!slides.length)throw new Error("沒有可轉換的內容");
  const p=new PptxGenJS();p.layout="LAYOUT_16x9";p.title=titleOf(txt,name);
  const F="標楷體",INK="17211F",AC="0F6B5C";
  slides.forEach((sl,idx)=>{
    const chunks=[];for(let k=0;k<Math.max(1,sl.items.length);k+=7)chunks.push(sl.items.slice(k,k+7));
    chunks.forEach((its,ci)=>{
      const s=p.addSlide();s.background={color:"FFFFFF"};
      s.addShape(p.ShapeType.rect,{x:0,y:0,w:0.18,h:5.625,fill:{color:AC}});
      const title=(sl.title||p.title)+(ci?"（續）":"");
      if(idx===0&&!ci&&!sl.items.some(x=>x.bul)&&!sl.tbl.length){
        s.addText(title,{x:0.8,y:1.6,w:8.4,h:1.4,fontFace:F,fontSize:36,bold:true,color:AC,fit:"shrink"});
        if(its.length)s.addText(its.map(x=>strip(x.t)).join("\n"),{x:0.8,y:3.1,w:8.4,h:1.6,fontFace:F,fontSize:18,color:"5D6B67",valign:"top",fit:"shrink"});
        return}
      s.addText(title,{x:0.5,y:0.3,w:9,h:0.9,fontFace:F,fontSize:28,bold:true,color:AC,fit:"shrink"});
      const hasT=sl.tbl.length&&!ci;
      if(its.length)s.addText(its.map(x=>{const o={breakLine:true,fontSize:its.length>5?16:18,color:INK,fontFace:F,bold:!!x.head};if(x.bul){o.bullet={indent:18};o.indentLevel=x.lv||0}return{text:strip(x.t),options:o}}),{x:0.5,y:1.3,w:9,h:hasT?1.9:3.8,valign:"top",fit:"shrink"});
      if(hasT)s.addTable(sl.tbl.map((r,ri)=>r.map(c=>{const o={bold:ri===0,fontFace:F,fontSize:13,color:INK};if(ri===0)o.fill={color:"E3EFE9"};return{text:strip(c),options:o}})),{x:0.5,y:its.length?3.3:1.4,w:9,border:{type:"solid",color:"D6DDDB",pt:1}});
    })});
  await p.writeFile({fileName:fname(txt,name)+".pptx"});
}

function progDraw(f){

async function post(url,headers,body){
  for(let k=0;;k++){
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",...headers},body:JSON.stringify(body),signal:ctl.signal});
    const t=await r.text();if(r.ok)return JSON.parse(t);
    if((r.status===429||r.status>=500)&&k<2){await new Promise(ok=>setTimeout(ok,1500*(k+1)));continue}
    throw new Error("HTTP "+r.status+"："+t.slice(0,300));
  }}
function loadPuter(){return window.puter?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://js.puter.com/v2/";s.onload=ok;s.onerror=()=>no(new Error("無法載入 puter.js，請確認網路連線"));document.head.append(s)})}
async function promptChat(c,h,tools,sys){

  const msgs=[{role:"system",content:s}];
  for(const m of h){
    if(m.r==="u")msgs.push({role:"user",content:m.t});
    else if(m.r==="a")msgs.push({role:"assistant",content:(m.t||"")+(m.calls||[]).map(x=>"\n```tool\n"+JSON.stringify({name:x.name,args:x.args})+"\n```").join("")});
    else msgs.push({role:"user",content:"【工具結果】\n"+m.results.map(r=>r.name+"：\n"+r.out).join("\n---\n")});
  }
  let t;
  if(c.prov==="puter"){
    const r=await puter.ai.chat(msgs,{model:c.model});
    if(ctl&&ctl.signal.aborted)throw abortErr();
    const c0=r&&r.message?r.message.content:r;
    t=typeof c0==="string"?c0:Array.isArray(c0)?c0.map(x=>x.text||"").join(""):String(r);
  }else{
    const base=c.base.replace(/\/+$/,"");
    if(c.prov==="anthropic"){
      const j=await post(base+"/v1/messages",{"x-api-key":c.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},{model:c.model,max_tokens:4096,system:s,messages:msgs.slice(1)});
      t=j.content.filter(x=>x.type==="text").map(x=>x.text).join("\n");
    }else{
      const j=await post(base+"/chat/completions",c.key?{Authorization:"Bearer "+c.key}:{},{model:c.model,messages:msgs});
      t=j.choices[0].message.content||"";
    }
  }
  const calls=[];
  t=t.replace(/```tool\s*([\s\S]*?)```/g,(_,j)=>{try{const o=JSON.parse(j);if(o.name)calls.push({id:uid(),name:o.name,args:o.args||{}})}catch(e){}return""}).trim();
  return{t,calls};
}
async function llm(c,h,tools,sys){
  if(c.prov==="demo")return demoLlm(c,h,tools,sys);
  if(c.prov==="puter"||(tools.length&&c.tm==="prompt"))return promptChat(c,h,tools,sys);
  try{return await nativeLlm(c,h,tools,sys)}
  catch(e){
    if(tools.length&&c.tm!=="native"&&/does not support tool|not support tool|tools? (is |are )?not supported|不支援/i.test(e.message)){
      c.tm="prompt";save();L("s","「"+c.name+"」的模型不支援原生工具呼叫，已自動改用提示詞模式（已記住，可在 AI 設定中修改）。");
      return promptChat(c,h,tools,sys);
    }

  }
}
async function nativeLlm(c,h,tools,sys){
  const base=c.base.replace(/\/+$/,"");
  if(c.prov==="anthropic"){
    const msgs=h.map(m=>m.r==="u"?{role:"user",content:m.t}:m.r==="a"?{role:"assistant",content:[...(m.t?[{type:"text",text:m.t}]:[]),...(m.calls||[]).map(x=>({type:"tool_use",id:x.id,name:x.name,input:x.args}))]}:{role:"user",content:m.results.map(r=>({type:"tool_result",tool_use_id:r.id,content:r.out}))});
    const body={model:c.model,max_tokens:4096,system:sys,messages:msgs};
    if(tools.length)body.tools=tools.map(t=>({name:t.name,description:t.description,input_schema:{type:"object",properties:t.props,required:t.req}}));
    const j=await post(base+"/v1/messages",{"x-api-key":c.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body);
    return{t:j.content.filter(x=>x.type==="text").map(x=>x.text).join("\n"),calls:j.content.filter(x=>x.type==="tool_use").map(x=>({id:x.id,name:x.name,args:x.input||{}}))};
  }
  const msgs=[{role:"system",content:sys}];
  for(const m of h){if(m.r==="u")msgs.push({role:"user",content:m.t});else if(m.r==="a"){const o={role:"assistant",content:m.t||null};if(m.calls&&m.calls.length)o.tool_calls=m.calls.map(x=>({id:x.id,type:"function",function:{name:x.name,arguments:JSON.stringify(x.args)}}));msgs.push(o)}else m.results.forEach(r=>msgs.push({role:"tool",tool_call_id:r.id,content:r.out}))}
  const body={model:c.model,messages:msgs};
  if(tools.length)body.tools=tools.map(t=>({type:"function",function:{name:t.name,description:t.description,parameters:{type:"object",properties:t.props,required:t.req}}}));
  const j=await post(base+"/chat/completions",c.key?{Authorization:"Bearer "+c.key}:{},body);
  const m=j.choices[0].message;
  return{t:m.content||"",calls:(m.tool_calls||[]).map(x=>{let g={};try{g=JSON.parse(x.function.arguments||"{}")}catch(e){}return{id:x.id,name:x.function.name,args:g}})};
}

async function addFiles(files,dir){

 for(const f of files){
  if(f.size>2e6){toast(f.name+" 太大（上限 2 MB）");continue}
  let t;try{t=await f.text()}catch(e){continue}
  if(t.includes("\0")){toast(f.name+" 不是文字檔，已略過");continue}
  MEM.files[(dir?dir+"/":"")+f.name]=t;n++;
 }
 memSave();toast(n?"已加入 "+n+" 個檔案":"沒有加入任何檔案");renderSet();
}

 if(t.dataset.prov){const base=t.dataset.prov.replace(/\.prov$/,"");const o=base.split(".").reduce((a,k)=>a[k],S);o.base=PRESET[v][0];o.model=PRESET[v][1];save();renderAll()}
 else if(t.dataset.re)renderAll();
}
function sideChange(e){
 const t=e.target;
 if(t.id==="upFile"){addFiles([...t.files],$("#upDir").value);t.value="";return}
 const a=t.dataset.act;
 if(a==="pickflow"){S.cf=+t.value;save();renderAll()}
 else if(a==="pickllm"){S.cl=+t.value;save();renderSet()}
 else if(a==="tpl"){const tp=TPL[t.value];if(tp){S.roles.push({id:uid(),name:tp.name,sys:tp.sys,tools:[...tp.tools],dir:"",llm:"",max:8,pal:makePal()});save();renderAll();toast("已加入「"+tp.name+"」")}}
 else sideInput(e);
}
for(const id of["#teamBox","#setBox"]){const el=$(id);el.addEventListener("click",sideClick);el.addEventListener("input",sideInput);el.addEventListener("change",e=>{if(e.target.matches("select,input[type=file]"))sideChange(e)})}

let detSig="";

function renderDetail(force){
 const box=$("#detail"),a=oa(O.sel),r=a&&S.roles.find(x=>x.id===a.id);
 dirtyDetail=false;
 if(!a||!r){if(!box.hidden){box.hidden=true;box.innerHTML=""}detSig="";return}
 const acts=ACT[a.id]||[],sig=[a.status,a.act,acts.length?acts[0].ts:0,PEND.map(x=>x.id).join(),r.name,r.tools.join()].join("|");
 if(!force&&sig===detSig)return;detSig=sig;box.hidden=false;
 const st=STAT[a.status],mine=PEND.filter(x=>x.roleId===a.id);
 box.innerHTML=`<div class="card dcard"><div class="drow"><canvas class="av" id="dAv" width="24" height="26"></canvas><div class="grow"><b>${esc(r.name)}</b> <span class="pill st-${a.status}">${st[0]}</span><div class="mut">${esc(a.act||"—")}</div></div><button class="sm" data-do="dclose" aria-label="關閉角色詳情">✕</button></div>
  <div class="mut" style="margin-top:6px">AI：${esc(llmOf(r).name)} · 工具：${esc(r.tools.map(t=>TN[t]).join("、")||"無")} · 範圍：/${esc(r.dir||"")}</div>
  ${mine.map(x=>x.kind==="gate"?`<div class="row" style="margin-top:6px"><span class="mut">這一步在等你核准，請看上方「待處理」。</span></div>`:`<div class="row" style="margin-top:6px"><span class="grow">${esc(x.title)}</span><button class="sm ok" data-do="allow" data-id="${x.id}">允許</button><button class="sm bad" data-do="deny" data-id="${x.id}">拒絕</button></div>`).join("")}
  <div class="row" style="margin-top:8px"><button class="sm" data-do="editrole" data-id="${r.id}">編輯角色</button><button class="sm" data-do="reroll" data-id="${r.id}">🎲 換造型</button></div>
  <div class="lab">近期動作</div><ul class="log">${acts.slice(0,15).map(e=>`<li><time>${hms(e.ts)}</time><span>${esc(e.txt)}</span></li>`).join("")||'<li class="mut">還沒有動作</li>'}</ul></div>`;
 drawAvatar($("#dAv"),r.pal);
}
function uiTick(){if(dirtyDetail)renderDetail(false)}
function scrollToEl(el,beh="smooth"){
 if(isMobile()){const sb=$("#stage").getBoundingClientRect().bottom,tb=$(".tabs").offsetHeight,r=el.getBoundingClientRect();window.scrollBy({top:r.top-(sb+tb+10),behavior:beh})}
 else el.scrollIntoView({block:"start",behavior:beh});
}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-do]");if(!b)return;
 const d=b.dataset.do,id=b.dataset.id,it=PEND.find(x=>x.id===id);
 if(d==="allow"&&it)resolvePend(it,true);
 else if(d==="deny"&&it)resolvePend(it,false);
 else if(d==="gok"&&it)resolvePend(it,it.text);
 else if(d==="gno"&&it)resolvePend(it,null);
 else if(d==="allowall")PEND.filter(x=>x.kind==="write").forEach(x=>resolvePend(x,true));
 else if(d==="dclose")selectRole(null);
 else if(d==="editrole"){openRoles.add(id);switchTab("team");renderTeam();setTimeout(()=>{const c=$(`#teamBox details[data-rid="${id}"]`);if(c)scrollToEl(c)},60)}
 else if(d==="reroll"){const r=S.roles.find(x=>x.id===id);if(r){r.pal=makePal();save();ofcSync();renderTeam();renderDetail(true)}}
});
$("#btnPend").onclick=()=>{switchTab("run");setTimeout(()=>scrollToEl($("#pend")),40)};
function syncSound(){const b=$("#btnSound");b.textContent=S.ui.sound?"🔊":"🔇";b.setAttribute("aria-pressed",S.ui.sound)}
$("#btnSound").onclick=()=>{S.ui.sound=!S.ui.sound;save();syncSound();snd.pop();if($("#setBox")){const c=$('#setBox [data-ui="sound"]');if(c)c.checked=S.ui.sound}};

/* ---------- 便利貼 / 分頁 ---------- */
const jump=n=>{const c=[...log.querySelectorAll('[data-step="'+n.dataset.j+'"]')].pop();if(c){switchTab("run");scrollToEl(c)}};
$("#chips").addEventListener("click",e=>{const n=e.target.closest(".note");if(n)jump(n)});
$("#chips").addEventListener("keydown",e=>{const n=e.target.closest(".note");if(n&&(e.key==="Enter"||e.key===" ")){e.preventDefault();jump(n)}});
$("#ptog").onclick=()=>{const c=$("#prog").classList.toggle("col");$("#ptog").textContent=c?"展開便利貼":"收合便利貼"};
function switchTab(k){
 activeTab=k;$$(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===k));
 ["run","team","set","layout"].forEach(n=>{$("#p-"+n).hidden=n!==k});
 if(k==="set")renderSet();
 setEdit(k==="layout");

$$(".tab").forEach(b=>b.addEventListener("click",()=>{switchTab(b.dataset.tab);if(isMobile())window.scrollTo({top:Math.min(window.scrollY,0)})}));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#help").hidden){if(O.edit.on)switchTab("run");else if(O.sel)selectRole(null)}});

/* ====================== 使用說明(導覽) ====================== */
const HELP_KEY="xlxo_help_seen";
const HELP=[
 {t:"歡迎來到小蝦辦公室 👋",h:`<p>這是<b>多角色 AI 工作流</b>＋<b>像素辦公室</b>：你設定幾位「角色」、串成「流程」，輸入總目標後，每位角色會在辦公室裡依序開工——思考、讀檔、寫檔、把成果傳給下一位。</p>

let hi=0,hOpener=null,hTab="run";
const helpRaw=s=>!s.tg?null:(typeof s.tg==="function"?s.tg():$(s.tg));
function helpDraw(){
  const s=HELP[hi],last=hi===HELP.length-1;
  $("#hTitle").textContent=s.t;$("#hBody").innerHTML=s.h;
  $("#hDots").innerHTML=HELP.map((x,k)=>`<button type="button" class="dot${k===hi?" on":""}" data-k="${k}" aria-label="第 ${k+1} 步：${esc(x.t)}"${k===hi?' aria-current="step"':""}></button>`).join("");
  $("#hCount").textContent=(hi+1)+" / "+HELP.length;
  $("#hPrev").disabled=hi===0;$("#hNext").textContent=last?"開始使用":"下一步";$("#hBody").scrollTop=0;
}
function helpPlace(){
  const box=$(".hbox"),spot=$("#spot"),arr=$("#hArr"),help=$("#help");
  if(help.hidden)return;
  let el=helpRaw(HELP[hi]);if(el&&!el.getClientRects().length)el=null;
  const vw=innerWidth,vh=innerHeight,m=12;
  box.style.maxHeight=Math.min(vh-2*m,620)+"px";
  const bw=box.offsetWidth,bh=box.offsetHeight;
  if(!el){spot.hidden=true;arr.hidden=true;help.classList.add("dim");box.style.left=Math.max(m,(vw-bw)/2)+"px";box.style.top=Math.max(m,(vh-bh)/2)+"px";return}
  help.classList.remove("dim");
  const r=el.getBoundingClientRect(),p=6,g=16;
  spot.hidden=false;Object.assign(spot.style,{left:r.left-p+"px",top:r.top-p+"px",width:r.width+2*p+"px",height:r.height+2*p+"px"});
  let x,y,cls="";
  if(vw-r.right>=bw+g+p+m){cls="al";x=r.right+p+g;y=r.top}
  else if(vh-r.bottom>=bh+g+p+m){cls="au";y=r.bottom+p+g;x=r.left}
  else if(r.top>=bh+g+p+m){cls="ad";y=r.top-p-g-bh;x=r.left}
  else if(r.left>=bw+g+p+m){cls="ar";x=r.left-p-g-bw;y=r.top}
  else{x=(vw-bw)/2;y=vh-bh-m}
  x=Math.min(Math.max(m,x),vw-bw-m);y=Math.min(Math.max(m,y),vh-bh-m);
  box.style.left=x+"px";box.style.top=y+"px";
  if(!cls){arr.hidden=true;return}
  const cx=(Math.max(r.left,0)+Math.min(r.right,vw))/2,cy=(Math.max(r.top,0)+Math.min(r.bottom,vh))/2,cl=(v,a,b)=>Math.min(Math.max(v,a),b);
  arr.hidden=false;arr.className="harr "+cls;arr.style.left=arr.style.top="";
  if(cls==="al"||cls==="ar")arr.style.top=cl(cy-y-6,14,bh-26)+"px";else arr.style.left=cl(cx-x-6,14,bw-26)+"px";
}
function helpGo(k){
  hi=Math.max(0,Math.min(HELP.length-1,k));const s=HELP[hi];helpDraw();
  if(s.tab)switchTab(s.tab);
  const el=helpRaw(s);
  if(el){const d=el.closest("details");if(d&&!d.open)d.open=true}
  helpPlace();
  if(el){if(isMobile()&&!el.closest("#stage,#top"))scrollToEl(el,"instant");else el.scrollIntoView({block:"nearest",inline:"nearest"});requestAnimationFrame(helpPlace);setTimeout(helpPlace,200)}
}
function openHelp(){hOpener=document.activeElement;hTab=activeTab;$("#help").hidden=false;helpGo(0);$("#hNext").focus();try{localStorage.setItem(HELP_KEY,"1")}catch(e){}}
function closeHelp(){$("#help").hidden=true;$("#spot").hidden=true;switchTab(hTab);if(hOpener&&hOpener.focus&&document.contains(hOpener))hOpener.focus()}
$("#btnHelp").onclick=openHelp;$("#hSkip").onclick=closeHelp;
$("#hPrev").onclick=()=>{if(hi>0)helpGo(hi-1)};
$("#hNext").onclick=()=>{if(hi>=HELP.length-1)closeHelp();else helpGo(hi+1)};
$("#hDots").onclick=e=>{const b=e.target.closest(".dot");if(b)helpGo(+b.dataset.k)};
addEventListener("resize",helpPlace);
document.addEventListener("keydown",e=>{
  if($("#help").hidden)return;
  if(e.key==="Escape"){e.preventDefault();closeHelp();return}
  if(e.key==="ArrowRight"){e.preventDefault();$("#hNext").click();return}
  if(e.key==="ArrowLeft"){e.preventDefault();$("#hPrev").click();return}
  if(e.key==="Tab"){
    const f=[...$("#help").querySelectorAll("button:not([disabled])")];if(!f.length)return;
    const a=f[0],z=f[f.length-1];
    if(!$("#help").contains(document.activeElement)){e.preventDefault();a.focus()}
    else if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  }
},true);
const helpSeen=()=>{try{return localStorage.getItem(HELP_KEY)==="1"}catch(e){return true}};

/* ====================== 啟動 ====================== */
(async()=>{
 const m=await hGet("mem");if(m&&m.files){MEM.files=m.files;MEM.dirs=new Set(m.dirs||[])}
 if(S.wsKind==="fs"){const h=await hGet("root");if(h){try{if(await h.queryPermission({mode:"readwrite"})==="granted"){fsRoot=h;fsMsg="目前開放：/"+h.name}else fsMsg="「"+h.name+"」需重新授權，請再按一次選擇資料匣。"}catch(e){}}}
 O.set=S.ui;
 O.layout=sanitizeLayout(S.layout)||defaultLayout();S.layout=O.layout;
 if(isFresh&&!S.roles.length&&!S.flows.length)sample();else seedIfEmptyMem();
 buildEditorUI();updateSizeUI();updateUndo();syncSound();fillHist();
 rebuild();addPet();renderAll();switchTab("run");fit();
 new ResizeObserver(()=>fit()).observe($("#stage"));addEventListener("resize",fit);
 requestAnimationFrame(t=>{last=t;frame(t)});
 if(!helpSeen())setTimeout(openHelp,400);
})();
function seedIfEmptyMem(){}
})();
